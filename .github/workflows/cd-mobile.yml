name: CD - Mobile (Kotlin)

on:
  push:
    branches: [main]
    paths:
      - "apps/mobile-kotlin/**"
      - "packages/shared-libraries/generated-kotlin/**"
  pull_request:
    paths:
      - "apps/mobile-kotlin/**"

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"
      - name: Build with Gradle
        working-directory: apps/mobile-kotlin
        run: ../../gradlew build --project-dir . || ./gradlew build
      - name: Unit tests
        working-directory: apps/mobile-kotlin
        run: ./gradlew test

  deploy:
    needs: build-and-test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - run: echo "TODO: sign + upload APK/AAB to Play Console track"
